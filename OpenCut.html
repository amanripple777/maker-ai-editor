<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCut Browser Editor</title>
<style>
:root{color-scheme:dark;--bg:#0b0d11;--panel:#141820;--panel2:#1b202a;--line:#2b3340;--text:#f3f5f7;--muted:#8f9aaa;--accent:#6d8cff;--accent2:#37d5a3;--danger:#ff6e7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:#202633;color:var(--text);border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{border-color:#6375a9;background:#293249}button.primary{background:var(--accent);border-color:var(--accent);color:white}.app{height:100vh;display:grid;grid-template-rows:58px 1fr 250px;overflow:hidden}.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#10131a}.brand{font-weight:800;font-size:18px;letter-spacing:.2px}.brand b{color:var(--accent)}.spacer{flex:1}.status{color:var(--muted);font-size:12px}.main{display:grid;grid-template-columns:270px 1fr 250px;min-height:0}.panel{background:var(--panel);border-right:1px solid var(--line);min-height:0;overflow:auto}.right{border-left:1px solid var(--line);border-right:0;padding:15px}.section{padding:15px;border-bottom:1px solid var(--line)}h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 12px}.drop{border:1px dashed #4e5b73;border-radius:10px;text-align:center;padding:20px;color:var(--muted);margin-bottom:10px}.media{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px;background:var(--panel2);margin:7px 0;cursor:grab}.media small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb{width:42px;height:32px;object-fit:cover;background:#252b36;border-radius:4px}.workspace{display:grid;grid-template-rows:1fr 46px;background:#0f1218;min-width:0}.stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px}.stage canvas{max-width:100%;max-height:100%;background:#050608;box-shadow:0 12px 50px #000;width:min(760px,100%);aspect-ratio:16/9}.transport{display:flex;gap:8px;align-items:center;justify-content:center;border-top:1px solid var(--line);background:var(--panel)}.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:90px;text-align:center}.timeline{background:#10141b;border-top:1px solid var(--line);display:grid;grid-template-rows:40px 1fr;min-height:0}.ruler{position:relative;border-bottom:1px solid var(--line);overflow:hidden}.tick{position:absolute;top:0;height:100%;border-left:1px solid #394251;color:var(--muted);font-size:10px;padding:5px}.tracks{overflow:auto;padding:7px 0}.track{height:54px;position:relative;border-bottom:1px solid #202630;margin-left:55px;min-width:1000px}.track:before{content:attr(data-name);position:absolute;left:-52px;top:18px;color:var(--muted);font-size:11px}.clip{position:absolute;top:7px;height:40px;border-radius:6px;min-width:20px;overflow:hidden;padding:7px 9px;background:#334d96;border:1px solid #6680df;cursor:grab;white-space:nowrap}.clip.audio{background:#185f68;border-color:#39b5b8}.clip.text{background:#78533e;border-color:#d89b6b}.clip.selected{outline:2px solid white;z-index:2}.playline{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:5;pointer-events:none}.field{display:grid;gap:6px;margin:12px 0}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%;padding:8px;background:#0e1117;border:1px solid var(--line);color:var(--text);border-radius:6px}.row{display:flex;gap:8px;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px;line-height:1.5}.warn{color:#ffc66d}.hidden{display:none!important}@media(max-width:900px){.main{grid-template-columns:220px 1fr}.right{display:none}.app{grid-template-rows:58px 1fr 220px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><b>✦</b> OpenCut</div><span class="status" id="status">Browser editor · local only</span><div class="spacer"></div><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save</button><button id="load">Load</button><button class="primary" id="export">Export WebM</button><input id="projectFile" class="hidden" type="file" accept="application/json"></header>
<main class="main">
<aside class="panel"><section class="section"><h3>Media</h3><div class="drop" id="drop">Drop files here<br><button id="import">Import media</button><input id="files" class="hidden" type="file" multiple accept="video/*,audio/*,image/*"></div><div id="mediaList"></div></section><section class="section"><h3>Add</h3><div class="row"><button id="addText">Add text</button><button id="addCaption">Add caption</button></div><p class="hint">Drag an item from Media onto a timeline track. Files never leave this browser.</p></section></aside>
<section class="workspace"><div class="stage"><canvas id="preview" width="960" height="540"></canvas></div><div class="transport"><button id="back">◀</button><button id="play" class="primary">Play</button><button id="forward">▶</button><span class="time" id="clock">00:00.0 / 00:30.0</span><input id="seek" type="range" min="0" max="30" step=".01" value="0" style="width:min(360px,35vw)"></div></section>
<aside class="panel right"><h3>Inspector</h3><div id="inspector"><p class="hint">Select a clip to edit its properties.</p></div><hr><p class="hint">Shortcuts: Space play/pause · S split · Delete remove · Ctrl/Cmd+Z undo.</p></aside>
</main>
<section class="timeline"><div class="ruler" id="ruler"></div><div class="tracks" id="tracks"><div class="track" data-name="Video" data-track="video"></div><div class="track" data-name="Audio" data-track="audio"></div><div class="track" data-name="Text" data-track="text"></div><div class="playline" id="playline"></div></div></section>
</div>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), canvas=$('#preview'), ctx=canvas.getContext('2d');
const initial=()=>({duration:30,playhead:0,clips:[],selected:null}); let state=initial(), history=[], future=[], media=new Map(), urls=new Map(), playing=false, raf=0;
const uid=()=>Math.random().toString(36).slice(2,10), fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')}`, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function snapshot(){return JSON.stringify(state)} function change(fn){history.push(snapshot());future=[];fn();render()} function selected(){return state.clips.find(c=>c.id===state.selected)}
function render(){
 $('#clock').textContent=`${fmt(state.playhead)} / ${fmt(state.duration)}`; $('#seek').value=state.playhead; $('#seek').max=Math.max(30,state.duration); $('#play').textContent=playing?'Pause':'Play';
 $('#mediaList').innerHTML=[...media.values()].map(m=>`<div class="media" draggable="true" data-media="${m.id}"><img class="thumb" src="${m.url}"><div><b>${esc(m.name)}</b><small>${m.type} · ${fmt(m.duration||0)}</small></div></div>`).join('');
 const scale=34; document.querySelectorAll('.track').forEach(t=>t.innerHTML=''); state.clips.forEach(c=>{const t=document.querySelector(`[data-track="${c.type==='image'?'video':c.type}"]`)||document.querySelector('[data-track="video"]');const el=document.createElement('div');el.className=`clip ${c.type} ${c.id===state.selected?'selected':''}`;el.dataset.id=c.id;el.style.left=`${c.start*scale}px`;el.style.width=`${Math.max(20,c.duration*scale)}px`;el.textContent=c.type==='text'?c.text:c.name; t.appendChild(el)});
 $('#playline').style.left=`${55+state.playhead*scale}px`; draw(); inspector(); bindDynamic();
}
function bindDynamic(){document.querySelectorAll('.media').forEach(e=>e.ondragstart=x=>x.dataTransfer.setData('media',e.dataset.media));document.querySelectorAll('.clip').forEach(e=>e.onclick=()=>{state.selected=e.dataset.id;render()});document.querySelectorAll('.track').forEach(t=>{t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();const m=media.get(e.dataTransfer.getData('media'));if(!m)return;change(()=>state.clips.push({id:uid(),type:t.dataset.track==='text'?'text':m.type,name:m.name,text:'New text',source:m.url,start:Math.max(0,state.playhead),duration:Math.max(.5,m.duration||5),volume:1,transition:'none'}))}})}
function inspector(){const c=selected();if(!c){$('#inspector').innerHTML='<p class="hint">Select a clip to edit its properties.</p>';return}$('#inspector').innerHTML=`<div class="field"><label>Name / text</label><input id="pname" value="${esc(c.type==='text'?c.text:c.name)}"></div><div class="field"><label>Start (seconds)</label><input id="pstart" type="number" min="0" step=".1" value="${c.start}"></div><div class="field"><label>Duration (seconds)</label><input id="pduration" type="number" min=".1" step=".1" value="${c.duration}"></div><div class="field"><label>Audio volume</label><input id="pvolume" type="range" min="0" max="1" step=".05" value="${c.volume??1}"></div><div class="field"><label>Transition</label><select id="transition"><option ${c.transition==='none'?'selected':''}>none</option><option ${c.transition==='fade'?'selected':''}>fade</option></select></div><button id="remove">Delete clip</button>`;['pname','pstart','pduration','pvolume','transition'].forEach(id=>$('#'+id).onchange=()=>change(()=>{const x=selected();if(!x)return;if(id==='pname')x[c.type==='text'?'text':'name']=$('#'+id).value;if(id==='pstart')x.start=Math.max(0,+$('#'+id).value);if(id==='pduration')x.duration=Math.max(.1,+$('#'+id).value);if(id==='pvolume')x.volume=+$('#'+id).value;if(id==='transition')x.transition=$('#'+id).value}));$('#remove').onclick=()=>change(()=>{state.clips=state.clips.filter(x=>x.id!==c.id);state.selected=null})}
function draw(){ctx.fillStyle='#080a0e';ctx.fillRect(0,0,canvas.width,canvas.height);const active=state.clips.filter(c=>state.playhead>=c.start&&state.playhead<c.start+c.duration).sort((a,b)=>a.type==='text'?1:-1);const video=active.find(c=>c.type==='video'||c.type==='image');if(video){const m=[...media.values()].find(x=>x.id===video.mediaId);if(m&&m.element){if(video.type==='video')ctx.drawImage(m.element,0,0,canvas.width,canvas.height);else ctx.drawImage(m.element,0,0,canvas.width,canvas.height)}}else{ctx.fillStyle='#252b36';ctx.font='24px system-ui';ctx.textAlign='center';ctx.fillText('Import media and drag it to the timeline',canvas.width/2,canvas.height/2)}active.filter(c=>c.type==='text').forEach(c=>{ctx.fillStyle='white';ctx.font='bold 42px system-ui';ctx.textAlign='center';ctx.shadowColor='black';ctx.shadowBlur=8;ctx.fillText(c.text,canvas.width/2,canvas.height*.82);ctx.shadowBlur=0})}
function addFiles(list){[...list].forEach(file=>{const id=uid(),url=URL.createObjectURL(file), type=file.type.startsWith('video')?'video':file.type.startsWith('audio')?'audio':'image', el=document.createElement(type==='audio'?'audio':type);el.src=url;el.preload='metadata';el.muted=true;el.onloadedmetadata=()=>{const m=media.get(id);m.duration=el.duration||5;render()};if(type==='image')el.onload=()=>render();media.set(id,{id,url,name:file.name,type,duration:5,element:el});urls.set(id,url);render()})}
function split(){const c=selected();if(!c||state.playhead<=c.start||state.playhead>=c.start+c.duration)return;change(()=>{const d=state.playhead-c.start;c.duration=d;state.clips.push({...c,id:uid(),start:state.playhead,duration:c.duration-d})})}
function undo(){if(!history.length)return;future.push(snapshot());state=JSON.parse(history.pop());render()}function redo(){if(!future.length)return;history.push(snapshot());state=JSON.parse(future.pop());render()}
function saveFile(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='opencut-project.json';a.click()}
function exportWebM(){if(!window.MediaRecorder||!canvas.captureStream){alert('This browser does not support Canvas MediaRecorder export. Use Chrome or Edge.');return}const stream=canvas.captureStream(30),rec=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='opencut-export.webm';a.click();$('#status').textContent='Export complete (video canvas; audio mixing is not included)'};rec.start();const start=performance.now(),old=playing;playing=true;function step(){state.playhead=Math.min(state.duration,(performance.now()-start)/1000);render();if(state.playhead>=state.duration){playing=old;rec.stop();state.playhead=0;render()}else requestAnimationFrame(step)}step()}
$('#import').onclick=()=>$('#files').click();$('#files').onchange=e=>addFiles(e.target.files);$('#drop').ondragover=e=>e.preventDefault();$('#drop').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};$('#play').onclick=()=>{playing=!playing;if(playing){let last=performance.now();const tick=now=>{state.playhead+=(now-last)/1000;last=now;if(state.playhead>=state.duration){state.playhead=0;playing=false}render();if(playing)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf);render()};$('#back').onclick=()=>{state.playhead=Math.max(0,state.playhead-1);render()};$('#forward').onclick=()=>{state.playhead=Math.min(state.duration,state.playhead+1);render()};$('#seek').oninput=e=>{state.playhead=+e.target.value;render()};$('#undo').onclick=undo;$('#redo').onclick=redo;$('#save').onclick=saveFile;$('#load').onclick=()=>$('#projectFile').click();$('#projectFile').onchange=e=>{const r=new FileReader();r.onload=()=>{try{state={...initial(),...JSON.parse(r.result),clips:JSON.parse(r.result).clips||[]};render()}catch{alert('Invalid project file')}};r.readAsText(e.target.files[0])};$('#export').onclick=exportWebM;$('#addText').onclick=()=>change(()=>{const text=prompt('Text overlay','Your story starts here');if(text)state.clips.push({id:uid(),type:'text',text,start:state.playhead,duration:4,volume:0,transition:'none'})});$('#addCaption').onclick=()=>change(()=>{const text=prompt('Caption','Caption');if(text)state.clips.push({id:uid(),type:'text',text,start:state.playhead,duration:3,volume:0,transition:'fade'})});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('#play').click()}if(e.key.toLowerCase()==='s')split();if(e.key==='Delete'||e.key==='Backspace')selected()&&change(()=>{state.clips=state.clips.filter(c=>c.id!==state.selected);state.selected=null});if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});for(let i=0;i<=30;i+=5){const x=document.createElement('span');x.className='tick';x.style.left=`${i*34}px`;x.textContent=fmt(i);$('#ruler').appendChild(x)};render();
})();
</script>
</body>
</html>
